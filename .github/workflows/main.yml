name: CI/CD Pipeline (Login & Product Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ---------------------------------------------
  # JOB 1 — BACKEND UNIT TESTS
  # ---------------------------------------------
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm install

      - run: npm test -- --coverage
        env:
          JWT_SECRET: "test-ci-secret"
          PORT: 5000

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage


  # ---------------------------------------------
  # JOB 2 — FRONTEND UNIT TESTS
  # ---------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm install

      - run: npm test -- --coverage
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage


  # ---------------------------------------------
  # JOB 3 — CYPRESS + MONGODB + BACKEND
  # ---------------------------------------------
  e2e-test:
    name: E2E Login & Product Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # --- BACKEND ---
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Backend
        working-directory: ./server
        run: npm install

      - name: Start Backend
        working-directory: ./server
        run: |
          nohup npm start &
          sleep 8
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: "ci-test-secret"

      - name: Wait Backend Ready
        run: npx wait-on http://localhost:5000 --timeout 60000


      # --- FRONTEND + CYPRESS ---
      - name: Install Frontend
        working-directory: ./client
        run: npm install

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./client
          start: npm start
          browser: chrome
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
        env:
          CI: true
          CYPRESS_baseUrl: http://localhost:3000
          REACT_APP_API_URL: http://localhost:5000   # <—— ĐÃ FIX QUAN TRỌNG


      - name: Upload Cypress Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: |
            client/cypress/screenshots
            client/cypress/videos
