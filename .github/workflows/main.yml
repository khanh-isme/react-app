name: CI/CD Pipeline (Login & Product Tests)

# Workflow kích hoạt khi có code push lên nhánh main hoặc master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BACKEND UNIT TESTS (Test Service, Controller...)
  # ------------------------------------------------------------------
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      # Chạy Jest cho backend
      - name: Run Backend Tests
        run: npm test

  # ------------------------------------------------------------------
  # JOB 2: FRONTEND UNIT TESTS (Test Component, Mocking...)
  # ------------------------------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      # Chạy test frontend. Biến CI=true giúp test chạy 1 lần rồi dừng (không watch)
      - name: Run Frontend Component Tests
        run: npm test
        env:
          CI: true

  # ------------------------------------------------------------------
  # JOB 3: E2E AUTOMATION TESTING (Cypress - Login Flow)
  # ------------------------------------------------------------------
  e2e-test:
    name: E2E Login & Product Tests
    runs-on: ubuntu-latest
    # Tạo MongoDB ảo để Backend kết nối khi test
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BƯỚC 3.1: CHUẨN BỊ VÀ CHẠY SERVER (BACKEND) ---
      - name: Setup Backend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Start Backend Server
        working-directory: ./server
        # Chạy server ở chế độ nền (&) để terminal không bị treo
        run: |
          npm start &
          echo "Backend started in background..."
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test_db 

      # Chờ 60s để chắc chắn Server đã khởi động xong tại port 5000
      - name: Wait for Backend to be ready
        run: npx wait-on http://localhost:5000 --timeout 60000

      # --- BƯỚC 3.2: CHUẨN BỊ VÀ CHẠY CYPRESS (FRONTEND) ---
      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./client
          # Action này sẽ tự động chạy lệnh 'npm start' của client
          start: npm start
          # Nó sẽ đợi cho đến khi url này truy cập được mới bắt đầu test
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
        env:
          # Nếu Client cần biết API ở đâu
          REACT_APP_API_URL: http://localhost:5000

      # --- BƯỚC 3.3: LƯU BÁO CÁO (NẾU LỖI) ---
      - name: Upload Cypress Screenshots/Videos
        uses: actions/upload-artifact@v4
        if: failure() # Chỉ chạy bước này nếu test bị fail
        with:
          name: cypress-evidence
          path: |
            client/cypress/screenshots
            client/cypress/videos