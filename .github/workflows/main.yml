name: CI/CD Pipeline (Login & Product Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BACKEND UNIT TESTS
  # ------------------------------------------------------------------
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      # SỬA: Thêm biến môi trường giả vào đây để Jest không bị lỗi thiếu config
      - name: Run Backend Tests
        run: npm test
        env:
          JWT_SECRET: "test-secret-key-for-ci" 
          PORT: 5000

  # ------------------------------------------------------------------
  # JOB 2: FRONTEND UNIT TESTS (Giữ nguyên vì đã chạy OK)
  # ------------------------------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Component Tests
        run: npm test
        env:
          CI: true

  # ------------------------------------------------------------------
  # JOB 3: E2E AUTOMATION TESTING
  # ------------------------------------------------------------------
  e2e-test:
    name: E2E Login & Product Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BACKEND ---
      - name: Setup Backend Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      # SỬA: Thêm JWT_SECRET lấy từ GitHub Secrets để Server khởi động được
      - name: Start Backend Server
        working-directory: ./server
        run: |
          npm start &
          echo "Backend started in background..."
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: ${{ secrets.JWT_SECRET }} 

      - name: Wait for Backend
        run: npx wait-on http://localhost:5000 --timeout 60000

      # --- FRONTEND & CYPRESS ---
      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./client
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
        env:
          REACT_APP_API_URL: http://localhost:5000
          # Nếu Frontend cũng cần biến môi trường thì thêm vào đây

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-evidence
          path: |
            client/cypress/screenshots
            client/cypress/videos