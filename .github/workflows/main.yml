name: CI/CD Pipeline (Login & Product Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ----------------------------------------------------------
  #  JOB 1 — BACKEND UNIT TESTS (Jest)
  # ----------------------------------------------------------
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Backend Tests
        run: npm test -- --coverage
        env:
          JWT_SECRET: "test-ci-secret"
          PORT: 5000

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage


  # ----------------------------------------------------------
  #  JOB 2 — FRONTEND TESTS (React + Jest + RTL)
  # ----------------------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Component Tests
        run: npm test -- --coverage
        env:
          CI: true

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage


  # ----------------------------------------------------------
  #  JOB 3 — E2E TESTS (Cypress + MongoDB + Backend)
  # ----------------------------------------------------------
  e2e-test:
    name: E2E Login & Product Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BACKEND ---
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Start Backend Server
        working-directory: ./server
        run: |
          nohup npm start &
          sleep 5
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for Backend API
        run: npx wait-on http://localhost:5000 --timeout 60000

      # --- FRONTEND + CYPRESS ---
      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm install

      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./client
          start: CI=true npm start
          browser: chrome
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://localhost:3000
          REACT_APP_API_URL: http://localhost:5000

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-report
          path: |
            client/cypress/screenshots
            client/cypress/videos
